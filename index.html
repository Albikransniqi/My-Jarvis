<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JARVIS AI</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;background:#080d18;color:#eaf2ff;

  font-family:Arial,sans-serif;padding:24px;

}

h1{color:#55c8ff;text-align:center;margin-top:35px}

.status{text-align:center;color:#7ee7bd}

.panel{

  background:#111c30;border:1px solid #24415e;

  border-radius:18px;padding:18px;margin:20px 0;

}

#chat{height:300px;overflow:auto;line-height:1.5}

input{

  width:100%;padding:15px;border-radius:12px;

  border:1px solid #31516e;background:#081323;

  color:white;font-size:16px;

}

button{

  padding:13px;border:0;border-radius:12px;

  background:#087fbd;color:white;font-size:16px;

  margin-top:10px;margin-right:5px;

}

.message{margin:12px 0;overflow-wrap:anywhere}

</style>

</head>

<body>

<h1>🤖 J.A.R.V.I.S.</h1>

<p class="status">● SYSTEM ONLINE</p>

<div class="panel">

  <div id="chat">

    <div class="message"><b>JARVIS:</b> Guten Tag! Ich bin bereit.</div>

  </div>

</div>

<div class="panel">

  <input id="question" placeholder="Schreib JARVIS etwas...">

  <button onclick="send()">Senden</button>

  <button onclick="searchWeb()">Websuche</button>

  <button onclick="speakLast()">Vorlesen</button>

</div>

<script>

const chat = document.getElementById("chat");

const input = document.getElementById("question");

let lastReply = "Guten Tag! Ich bin bereit.";

function addMessage(name,text){

  const div=document.createElement("div");

  div.className="message";

  const bold=document.createElement("b");

  bold.textContent=name+": ";

  div.appendChild(bold);

  div.appendChild(document.createTextNode(text));

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;

}

function send(){

  const q=input.value.trim();

  if(!q)return;

  addMessage("DU",q);

  input.value="";

  let answer;

  if(q.toLowerCase().includes("hallo")){

    answer="Hallo! Schön, dass du da bist.";

  }else if(q.toLowerCase().includes("wie heißt du")){

    answer="Ich bin JARVIS, dein persönlicher Assistent.";

  }else if(q.toLowerCase().includes("zeit")){

    answer="Es ist "+new Date().toLocaleTimeString("de-DE")+".";

  }else if(q.toLowerCase().includes("datum")){

    answer="Heute ist der "+new Date().toLocaleDateString("de-DE")+".";

  }else{

    answer="Ich habe dich gehört. Meine KI-Verbindung müssen wir noch einrichten.";

  }

  lastReply=answer;

  addMessage("JARVIS",answer);

}

function speakLast(){

  if(!("speechSynthesis" in window)){

    alert("Sprachausgabe wird hier nicht unterstützt.");

    return;

  }

  const speech=new SpeechSynthesisUtterance(lastReply);

  speech.lang="de-DE";

  speechSynthesis.speak(speech);

}

function searchWeb(){

  const q=input.value.trim();

  if(!q)return;

  window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");

}

</script>

</body>

</html>
